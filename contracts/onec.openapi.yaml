openapi: 3.1.0
info:
  title: HTTP-сервис 1С для ЛК опта
  version: 1.0.0
  description: "Собрано из shared/onec/schemas.ts. Описание и порядок сдачи — docs/onec-contract.md. Не править руками: pnpm onec:openapi."
security:
  - bearer: []
  - basic: []
paths:
  /clients:
    get:
      summary: Контрагенты с договорами и адресами доставки
      parameters:
        - name: changedSince
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Только изменённое строго позже этого момента, включая пометку удаления
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 500
      responses:
        "200":
          description: Страница
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientsPage"
        "400":
          description: Неверные параметры
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Нет или неверный Bearer-токен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Сервис временно недоступен — ЛК повторит запрос
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /client/{guid}:
    get:
      summary: "Один клиент по GUID: договор, адреса, регион — ЛК грузит его при входе и по расписанию"
      parameters:
        - name: guid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Клиент
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "400":
          description: Неверные параметры
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Нет или неверный Bearer-токен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Нет такого клиента
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Сервис временно недоступен — ЛК повторит запрос
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /image/{id}:
    get:
      summary: Картинка товара в base64 (JPEG, PNG, WebP; до 5 МБ)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{1,64}$
      responses:
        "200":
          description: Файл
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageFile"
        "400":
          description: Неверные параметры
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Нет или неверный Bearer-токен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Нет картинки
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Сервис временно недоступен — ЛК повторит запрос
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /catalog:
    get:
      summary: "Каталог: разделы (виды номенклатуры) на первой странице, товары постранично"
      parameters:
        - name: changedSince
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Только изменённое строго позже этого момента, включая пометку удаления
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 500
      responses:
        "200":
          description: Страница
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogPage"
        "400":
          description: Неверные параметры
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Нет или неверный Bearer-токен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Сервис временно недоступен — ЛК повторит запрос
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /prices:
    get:
      summary: "Прайс: цены по видам цен, с НДС, по изменениям"
      parameters:
        - name: changedSince
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Только изменённое строго позже этого момента, включая пометку удаления
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 500
      responses:
        "200":
          description: Страница
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricesPage"
        "400":
          description: Неверные параметры
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Нет или неверный Bearer-токен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Сервис временно недоступен — ЛК повторит запрос
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /stock:
    get:
      summary: Свободный остаток без резервов
      parameters:
        - name: changedSince
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Только изменённое строго позже этого момента, включая пометку удаления
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 500
      responses:
        "200":
          description: Страница
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockPage"
        "400":
          description: Неверные параметры
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Нет или неверный Bearer-токен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Сервис временно недоступен — ЛК повторит запрос
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /order:
    post:
      summary: Заказ. Повтор с тем же externalId возвращает уже созданный заказ
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderRequest"
      responses:
        "200":
          description: Уже был создан с этим externalId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderCreated"
        "201":
          description: Создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderCreated"
        "400":
          description: Неверные параметры
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Нет или неверный Bearer-токен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Нет клиента
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Сервис временно недоступен — ЛК повторит запрос
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /orders/status:
    get:
      summary: Статусы заказов
      parameters:
        - name: changedSince
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Только изменённое строго позже этого момента, включая пометку удаления
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 500
      responses:
        "200":
          description: Страница
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderStatusPage"
        "400":
          description: Неверные параметры
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Нет или неверный Bearer-токен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Сервис временно недоступен — ЛК повторит запрос
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /delivery-schedule:
    get:
      summary: График доставки по бизнес-регионам, целиком (ведёт логист в 1С)
      responses:
        "200":
          description: Весь график
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliverySchedulePage"
        "400":
          description: Неверные параметры
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Нет или неверный Bearer-токен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Сервис временно недоступен — ЛК повторит запрос
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /trips:
    get:
      summary: Задания на перевозку (рейсы) по изменениям
      parameters:
        - name: changedSince
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Только изменённое строго позже этого момента, включая пометку удаления
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 500
      responses:
        "200":
          description: Страница
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripsPage"
        "400":
          description: Неверные параметры
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Нет или неверный Bearer-токен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Сервис временно недоступен — ЛК повторит запрос
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
    basic:
      type: http
      scheme: basic
  schemas:
    Error:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        error:
          type: string
          minLength: 1
        message:
          type: string
      required:
        - error
        - message
      additionalProperties: false
    Client:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        guid:
          type: string
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        name:
          type: string
        unp:
          type: string
        address:
          type: string
        city:
          type: string
        region:
          anyOf:
            - type: object
              properties:
                guid:
                  type: string
                  pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
                name:
                  type: string
              required:
                - guid
                - name
              additionalProperties: false
            - type: "null"
        shipmentBlocked:
          type: boolean
        managerEmail:
          type: string
        contract:
          anyOf:
            - type: object
              properties:
                guid:
                  type: string
                  pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
                name:
                  default: ""
                  type: string
                number:
                  type: string
                date:
                  type: string
                  format: date
                  pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
                priceTypeGuid:
                  type: string
                  pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
                paymentDelayDays:
                  type: integer
                  minimum: 0
                  maximum: 9007199254740991
                creditLimit:
                  type: number
                debt:
                  type: number
                currency:
                  type: string
                  pattern: ^[A-Z]{3}$
              required:
                - guid
                - name
                - number
                - date
                - priceTypeGuid
                - paymentDelayDays
                - creditLimit
                - debt
                - currency
              additionalProperties: false
            - type: "null"
        contracts:
          default: []
          type: array
          items:
            type: object
            properties:
              guid:
                type: string
                pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
              name:
                default: ""
                type: string
              number:
                type: string
              date:
                type: string
                format: date
                pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
              priceTypeGuid:
                type: string
                pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
              paymentDelayDays:
                type: integer
                minimum: 0
                maximum: 9007199254740991
              creditLimit:
                type: number
              debt:
                type: number
              currency:
                type: string
                pattern: ^[A-Z]{3}$
            required:
              - guid
              - name
              - number
              - date
              - priceTypeGuid
              - paymentDelayDays
              - creditLimit
              - debt
              - currency
            additionalProperties: false
        deliveryAddresses:
          type: array
          items:
            type: object
            properties:
              guid:
                type: string
                pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
              city:
                type: string
              address:
                type: string
            required:
              - guid
              - city
              - address
            additionalProperties: false
        changedAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
        deleted:
          type: boolean
      required:
        - guid
        - name
        - unp
        - address
        - city
        - region
        - shipmentBlocked
        - managerEmail
        - contract
        - contracts
        - deliveryAddresses
        - changedAt
        - deleted
      additionalProperties: false
    ClientsPage:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              guid:
                type: string
                pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
              name:
                type: string
              unp:
                type: string
              address:
                type: string
              city:
                type: string
              region:
                anyOf:
                  - type: object
                    properties:
                      guid:
                        type: string
                        pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
                      name:
                        type: string
                    required:
                      - guid
                      - name
                    additionalProperties: false
                  - type: "null"
              shipmentBlocked:
                type: boolean
              managerEmail:
                type: string
              contract:
                anyOf:
                  - type: object
                    properties:
                      guid:
                        type: string
                        pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
                      name:
                        default: ""
                        type: string
                      number:
                        type: string
                      date:
                        type: string
                        format: date
                        pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
                      priceTypeGuid:
                        type: string
                        pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
                      paymentDelayDays:
                        type: integer
                        minimum: 0
                        maximum: 9007199254740991
                      creditLimit:
                        type: number
                      debt:
                        type: number
                      currency:
                        type: string
                        pattern: ^[A-Z]{3}$
                    required:
                      - guid
                      - name
                      - number
                      - date
                      - priceTypeGuid
                      - paymentDelayDays
                      - creditLimit
                      - debt
                      - currency
                    additionalProperties: false
                  - type: "null"
              contracts:
                default: []
                type: array
                items:
                  type: object
                  properties:
                    guid:
                      type: string
                      pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
                    name:
                      default: ""
                      type: string
                    number:
                      type: string
                    date:
                      type: string
                      format: date
                      pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
                    priceTypeGuid:
                      type: string
                      pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
                    paymentDelayDays:
                      type: integer
                      minimum: 0
                      maximum: 9007199254740991
                    creditLimit:
                      type: number
                    debt:
                      type: number
                    currency:
                      type: string
                      pattern: ^[A-Z]{3}$
                  required:
                    - guid
                    - name
                    - number
                    - date
                    - priceTypeGuid
                    - paymentDelayDays
                    - creditLimit
                    - debt
                    - currency
                  additionalProperties: false
              deliveryAddresses:
                type: array
                items:
                  type: object
                  properties:
                    guid:
                      type: string
                      pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
                    city:
                      type: string
                    address:
                      type: string
                  required:
                    - guid
                    - city
                    - address
                  additionalProperties: false
              changedAt:
                type: string
                format: date-time
                pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
              deleted:
                type: boolean
            required:
              - guid
              - name
              - unp
              - address
              - city
              - region
              - shipmentBlocked
              - managerEmail
              - contract
              - contracts
              - deliveryAddresses
              - changedAt
              - deleted
            additionalProperties: false
        nextPage:
          anyOf:
            - type: integer
              exclusiveMinimum: 0
              maximum: 9007199254740991
            - type: "null"
      required:
        - items
        - nextPage
      additionalProperties: false
