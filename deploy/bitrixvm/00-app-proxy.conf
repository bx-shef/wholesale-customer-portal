# Домен ЛК → docker-контейнер на ВМ Битрикс24. Схема — bx-shef/client-bank-alfa-by.
#
# КУДА:      /etc/nginx/bx/site_settings/<домен>/00-app-proxy.conf
# ПРОВЕРКА:  nginx -t && systemctl reload nginx   (битый конфиг уронит и портал на этой же машине)
#
# Свой server-блок и свой `location /` не заводим: два блока с одним server_name — «conflicting
# server name» и Apache вместо ЛК; второй `location /` nginx не примет. Каталог site_settings
# BitrixVM инклюдит внутрь своего server-блока и не трогает при операциях меню.
#
# Ключ — переменная: bx/conf/bitrix.conf проксирует в $proxyserver. Переопределив её, забираем
# `location /` и прочие локейшены сайта целиком. Порт — APP_BIND_PORT из .env стека (по умолчанию 3000).
set $proxyserver "http://127.0.0.1:3000";

# Статику — руками: bitrix_general.conf отдаёт .css/.js из docroot без proxy_pass, а docroot у нас —
# заглушка. Без перехвата /_nuxt/* вернул бы страницу ошибки: HTML пришёл, скрипты нет.
location ^~ /_nuxt/ {
    proxy_pass $proxyserver;
}
location ~* \.(css|js|mjs|map|json|txt|xml|ico|png|jpg|jpeg|gif|svg|webp|avif|woff|woff2|ttf|otf|webmanifest)$ {
    proxy_pass $proxyserver;
}
location = /404.html {
    proxy_pass $proxyserver;
}

# Тела запросов ЛК малы (корзина до 200 строк, вход); 1 МБ с запасом.
client_max_body_size 1m;
# Стрим ИИ-чата (этап 5): ответы не копим в буфере, долгие ответы модели не рвём.
proxy_buffering off;
proxy_read_timeout 120s;
proxy_send_timeout 120s;

# HTTP/1.1 к контейнеру; `Connection ""` гасит close, иначе keep-alive не включится.
proxy_http_version 1.1;
proxy_set_header Connection "";
# Host и X-Forwarded-For уже заданы сайтовым конфигом BitrixVM. Вторая директива не заменяет, а
# добавляет заголовок — не дублируем.
#
# ⚠ Лимит входа ЛК считает попытки по ПРАВОМУ адресу X-Forwarded-For (TRUST_PROXY=1): его дописывает
# этот nginx, левые пишет клиент. Схема верна, пока nginx ВМ стоит на периметре. Если перед ВМ есть
# CDN, балансировщик или NAT-прокси, правым окажется он — все клиенты разделят один лимит, и один
# перебор закроет вход всем. Тогда здесь нужен real_ip: set_real_ip_from <адрес прокси>;
# real_ip_header X-Forwarded-For; и проверка — docs/DEPLOY_BITRIXVM.md, шаг 6.
